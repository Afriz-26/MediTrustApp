<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medi Trust — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(to bottom, #f0f9ff, #ffffff); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card { max-width: 24rem; text-align: center; }
    .icon { width: 4rem; height: 4rem; margin: 0 auto 1rem; background: linear-gradient(135deg, #3b82f6, #0ea5e9); border-radius: 1rem; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
    h1 { color: #1e293b; font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #64748b; font-size: 0.875rem; line-height: 1.5; }
    button { margin-top: 1.5rem; padding: 0.75rem 2rem; background: linear-gradient(to right, #3b82f6, #0ea5e9); color: white; border: none; border-radius: 0.75rem; font-weight: 600; font-size: 0.875rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🏥</div>
    <h1>You're Offline</h1>
    <p>Medi Trust needs an internet connection to load. Please check your network and try again.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
